server.port: 8443

# During development, allow forwarding the X-Forwarded-* and Forwarded headers from any proxies.
# When usd in QA and production, this should be set to a specific IP address or CIDR range, e.g. 10\.0\.0\..* (Java Regular Expression).
# For more information, see https://spring.io/security/cve-2025-41235
spring.cloud.gateway.server.webflux.trusted-proxies: ".*"

spring.ssl.bundle.jks.gateway:
  key:
    alias: edge
  keystore:
    type: PKCS12
    location: classpath:keystore/edge.p12
    password: learnSpring

server.ssl.bundle: gateway

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-composite
        url: /user-composite/v3/api-docs
      - name: exercise
        url: /exercise/openapi/v3/api-docs
      - name: auth-server
        url: /oauth2/openapi/v3/api-docs

spring.cloud.gateway.server.webflux.routes:

  - id: user-composite-swagger-ui
    uri: lb://USER-COMPOSITE
    predicates:
      - Path=/user-composite/openapi/**
    filters:
      - StripPrefix=1

  - id: user-composite
    uri: lb://USER-COMPOSITE
    predicates:
      - Path=/user-composite/**
    filters:
      - StripPrefix=1

  - id: exercise-swagger-ui
    uri: lb://EXERCISE
    predicates:
      - Path=/exercises/openapi/**
    filters:
      - StripPrefix=1

  - id: exercise
    uri: lb://EXERCISE
    predicates:
      - Path=/exercises/**
    filters:
      - StripPrefix=1


  - id: oauth2-server
    uri: lb://auth-server
    predicates:
      - Path=/oauth2/**

  - id: oauth2-login
    uri: lb://auth-server
    predicates:
      - Path=/login/**

  - id: oauth2-error
    uri: lb://auth-server
    predicates:
      - Path=/error/**

  - id: eureka-api
    uri: http://${app.eureka-server}:8761
    predicates:
      - Path=/eureka/api/{segment}
    filters:
      - SetPath=/eureka/{segment}

  - id: eureka-web-start
    uri: http://${app.eureka-server}:8761
    predicates:
      - Path=/eureka/web
    filters:
      - SetPath=/

  - id: eureka-web-other
    uri: http://${app.eureka-server}:8761
    predicates:
      - Path=/eureka/**

  - id: host_route_200
    uri: http://httpstat.us
    predicates:
      - Host=i.feel.lucky:8080
      - Path=/headerrouting/**
    filters:
      - SetPath=/200

  - id: host_route_418
    uri: http://httpstat.us
    predicates:
      - Host=im.a.teapot:8080
      - Path=/headerrouting/**
    filters:
      - SetPath=/418

  - id: host_route_501
    uri: http://httpstat.us
    predicates:
      - Path=/headerrouting/**
    filters:
      - SetPath=/501

spring.security.oauth2.resourceserver.jwt.issuer-uri: http://${app.auth-server}:9999

management.endpoint.gateway.enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: INFO
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: TRACE

