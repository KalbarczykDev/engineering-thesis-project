springdoc:
  swagger-ui.path: /openapi/swagger-ui.html
  api-docs.path: /openapi/v3/api-docs
  packagesToScan: dev.kalbarczyk.workoutservice.services
  pathsToMatch: /**
  cache.disabled: true

  swagger-ui:
    oauth2-redirect-url: https://localhost:8443/workouts/openapi/swagger-ui/oauth2-redirect.html
    oauth:
      clientId: writer
      clientSecret: secret-writer
      useBasicAuthenticationWithAccessCodeGrant: true
  oAuthFlow:
    authorizationUrl: https://localhost:8443/oauth2/authorize
    tokenUrl: https://localhost:8443/oauth2/token

server.forward-headers-strategy: framework

api:
  common:
    version: 1.0.0
    title: Workout Service API
    description: API for the Workout Service
    termsOfService: example.com/terms
    license: Example License
    licenseUrl: example.com/license
    externalDocDesc: Example External Docs
    externalDocUrl: example.com/repository
    contact:
      name: Oskar Kalbarczyk
      url: https://kalbarczyk.dev
      email: example@email.com

  responseCodes:
    ok.description: OK
    badRequest.description: Bad Request, invalid format of the request. See response message for more information
    notFound.description: Not found, the specified id does not exist
    unprocessableEntity.description: Unprocessable entity, input parameters caused the processing to fail. See response message for more information

  workout:
    updateWorkout:
      description: Updates an existing workout
      notes: |
        # Normal response
        If the specified workoutId is found the workout information will be updated with the information posted to the API.
        
        # Expected partial and error responses
        1. If no workout with the specified workoutId is found, a **404 - Not Found** error with a "workout not found" error message will be returned.

    getHistory:
      description: Gets workotus for the user id.
      notes: |
        # Normal response
        If the requested userId is found the method will return information regarding:
        1. Workouts added by the user

        # Expected partial and error responses
        1. If no workout information is found for the specified userId, an empty list will be returned.

    createWorkout:
      description: Creates a new workout
      notes: |
        # Normal response
        The createWorkout information posted to the API will be stored as a new workout entity.

        # Expected error responses
        1. If an workout with the same name as specified in the posted information already exists,
           an **422 - Unprocessable Entity** error with a "duplicate key" error message will be returned


server.port: 8080
server.error.include-message: always



spring.security.oauth2.resourceserver.jwt.issuer-uri: http://${app.auth-server}:9999



spring.data.mongodb:
  host: mongodb
  port: 27017
  database: mongo-db
  username: root
  password: pwd
  authentication-database: admin



logging:
  level:
    root: INFO
    dev.kalbarczyk: INFO
    org.springframework.data.mongodb.core.ReactiveMongoTemplate: DEBUG

