server:
  port: 8080
  error.include-message: always

spring:
  application:
    name: user
  datasource:
    url: jdbc:mysql://mysql/user-db
    username: user
    password: pwd
    hikari:
      initializationFailTimeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    function:
      definition: messageProcessor
    stream:
      defaultBinder: rabbit
      default.contentType: application/json
      bindings:
        messageProcessor-in-0:
          destination: users
          group: usersGroup
      rabbit:
        bindings:
          messageProcessor-in-0:
            consumer:
              autoBindDlq: true
              republishToDlq: true
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest


eureka:
  client:
    serviceUrl:
      defaultZone: http://u:p@eureka:8761/eureka/
    initialInstanceInfoReplicationIntervalSeconds: 5
    registryFetchIntervalSeconds: 5
  instance:
    hostname: user
    preferIpAddress: false
    leaseRenewalIntervalInSeconds: 5
    leaseExpirationDurationInSeconds: 5


logging:
  level:
    root: INFO
    dev.kalbarczyk: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoint:
    health:
      show-details: "ALWAYS"
  endpoints:
    web:
      exposure:
        include: "*"
